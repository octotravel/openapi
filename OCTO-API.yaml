        maxQuantity: 7
        paxCount: 1
        accompaniedBy: []
      title: UnitRestrictions
      properties:
        minAge:
          type: integer
          examples:
          - 18
          description: Minimum age for this unit type
        maxAge:
          type: integer
          examples:
          - 99
          description: Maximum age for this unit type
        idRequired:
          type: boolean
          description: Whether the traveler is required to present proof of identity at ticket redemption
          examples:
          - false
        minQuantity:
          type:
          - integer
          - 'null'
          examples:
          - 1
          description: Minimum number of this unit per booking
        maxQuantity:
          type:
          - 'null'
          - integer
          examples:
          - 7
          description: Maximum number of this unit per booking
        paxCount:
          type: integer
          description: Number of people this unit counts as (e.g. family = 4)
          examples:
          - 1
        accompaniedBy:
          type: array
          description: Unit IDs that must be included in Bookings, together with this unit (e.g. infant with adult)
          items:
            type: string
            examples:
            - UNIT-ADULT
      required:
      - minAge
      - maxAge
      - idRequired
      - minQuantity
      - maxQuantity
      - paxCount
      - accompaniedBy
    UnitType:
      type: string
      title: UnitType
      enum:
      - ADULT
      - YOUTH
      - CHILD
      - INFANT
      - FAMILY
      - SENIOR
      - STUDENT
      - MILITARY
      - OTHER
      examples:
      - ADULT
      - CHILD
      description: |-
        Base unit type category.

        Possible values:
        - `ADULT`: Standard adult ticket.
        - `YOUTH`: Youth/teenager ticket.
        - `CHILD`: Child ticket.
        - `INFANT`: Infant/baby ticket.
        - `FAMILY`: Family bundle ticket (see `paxCount` for equivalent adults).
        - `SENIOR`: Senior/pensioner ticket.
        - `STUDENT`: Student ticket (`idRequired` may apply).
        - `MILITARY`: Military personnel ticket.
        - `OTHER`: Any other unit type not covered by the above.
