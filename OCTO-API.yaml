        deliveryMethods:
          type: array
          description: The delivery methods applied to this Booking. Each value MUST be a `DeliveryMethod`, and determines which of `Booking.voucher` and `UnitItem.ticket` are populated.
          items:
            $ref: '#/components/schemas/DeliveryMethod'
        voucher:
          description: Single whole-Booking voucher (if `VOUCHER` is present in `deliveryMethods`)
          oneOf:
          - $ref: '#/components/schemas/Ticket'
          - type: 'null'
        unitItems:
          $ref: '#/components/schemas/BookingUnitItems'
