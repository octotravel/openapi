          description: The `localDateTimeEnd` value from the original availability object.
        allDay:
          type: boolean
          description: A boolean value indicating whether the availability is all day.
        openingHours:
          type: array
          description: The opening hours from the original availability object.
          items:
            $ref: '#/components/schemas/OpeningHours'
