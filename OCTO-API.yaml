  responses:
    Unauthorized:
      description: Unauthorized. The request did not include a valid API Key in the Authorization header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UNAUTHORIZED:
              $ref: '#/components/examples/ErrorUnauthorized'
    Forbidden:
      description: Forbidden. The API Key was recognised but is not permitted to perform this request, or has been revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            FORBIDDEN:
              $ref: '#/components/examples/ErrorForbidden'
    InternalServerError:
      description: Internal Server Error. The Supplier System encountered an unrecoverable error. The Reseller MAY retry the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            INTERNAL_SERVER_ERROR:
              $ref: '#/components/examples/ErrorInternalServerError'
    GetSupplierError:
      description: Bad Request. The request could not be processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Bad Request:
              value:
                error: BAD_REQUEST
                errorMessage: invalid supplier id
    GetProductError:
      description: Bad Request. The `productId` was missing or invalid.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
                examples:
                - INVALID_PRODUCT_ID
              errorMessage:
                type: string
                examples:
                - The productId was missing or invalid
              productId:
                type: string
                examples:
                - PROD-UNKNOWN-001
            required:
            - error
            - errorMessage
          examples:
            Invalid Product ID:
              $ref: '#/components/examples/ErrorInvalidProductID'
    AvailabilityCheckError:
      description: Bad Request. The Availability request was rejected, for example an unknown `productId` or `optionId`.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              errorMessage:
                type: string
              productId:
                type: string
              optionId:
                type: string
            required:
            - error
            - errorMessage
          examples:
            INVALID_PRODUCT_ID:
              $ref: '#/components/examples/ErrorInvalidProductID'
            INVALID_OPTION_ID:
              $ref: '#/components/examples/ErrorInvalidOptionID'
            BAD_REQUEST:
              value:
                error: BAD_REQUEST
                errorMessage: either localDate, localDateStart/localDateEnd or availabilityIds is required
    AvailabilityCalendarError:
      description: Bad Request. The Availability Calendar request was rejected, for example an unknown `productId` or `optionId`.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              errorMessage:
                type: string
              productId:
                type: string
              optionId:
                type: string
            required:
            - error
            - errorMessage
          examples:
            INVALID_PRODUCT_ID:
              $ref: '#/components/examples/ErrorInvalidProductID'
            INVALID_OPTION_ID:
              $ref: '#/components/examples/ErrorInvalidOptionID'
            BAD_REQUEST:
              value:
                error: BAD_REQUEST
                errorMessage: cannot request more than 1 year of availability
    BookingCreateError:
      description: Bad Request. The Booking could not be created, for example an unknown `productId`, `optionId`, `unitId` or `availabilityId`.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              errorMessage:
                type: string
              productId:
                type: string
              optionId:
                type: string
              availabilityId:
                type: string
              unitId:
                type: string
            required:
            - error
            - errorMessage
          examples:
            INVALID_PRODUCT_ID:
              $ref: '#/components/examples/ErrorInvalidProductID'
            INVALID_OPTION_ID:
              $ref: '#/components/examples/ErrorInvalidOptionID'
            INVALID_AVAILABILITY_ID:
              $ref: '#/components/examples/ErrorInvalidAvailabilityID'
            UNPROCESSABLE_ENTITY:
              value:
                error: UNPROCESSABLE_ENTITY
                errorMessage: 'Validation failed: a maximum of 20 units per Booking is allowed'
            INVALID_UNIT_ID:
              $ref: '#/components/examples/ErrorInvalidUnitID'
    BookingListError:
      description: Bad Request. The query was missing a required filter or was otherwise invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            example-1:
              value:
                error: BAD_REQUEST
                errorMessage: either resellerReference, supplierReference, localDate or localDateStart/localDateEnd is required
    BookingCancelError:
      description: Bad Request. The Booking could not be cancelled.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              errorMessage:
                type: string
              uuid:
                type: string
            required:
            - error
            - errorMessage
          examples:
            INVALID_BOOKING_UUID:
              $ref: '#/components/examples/ErrorInvalidBookingUUID'
            UNPROCESSABLE_ENTITY:
              $ref: '#/components/examples/ErrorUnprocessableEntity'
    BookingConfirmError:
      description: Bad Request. The Booking could not be confirmed.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              errorMessage:
                type: string
              productId:
                type: string
              optionId:
                type: string
              unitId:
                type: string
              availabilityId:
                type: string
              uuid:
                type: string
            required:
            - error
            - errorMessage
          examples:
            INVALID_PRODUCT_ID:
              $ref: '#/components/examples/ErrorInvalidProductID'
            INVALID_OPTION_ID:
              $ref: '#/components/examples/ErrorInvalidOptionID'
            INVALID_UNIT_ID:
              $ref: '#/components/examples/ErrorInvalidUnitID'
            INVALID_AVAILABILITY_ID:
              $ref: '#/components/examples/ErrorInvalidAvailabilityID'
            INVALID_BOOKING_UUID:
              $ref: '#/components/examples/ErrorInvalidBookingUUID'
            UNPROCESSABLE_ENTITY:
              $ref: '#/components/examples/ErrorUnprocessableEntity'
    BookingGetError:
      description: Bad Request. The Booking `uuid` was missing or invalid.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              errorMessage:
                type: string
              uuid:
                type: string
            required:
            - error
            - errorMessage
          examples:
            INVALID_BOOKING_UUID:
              $ref: '#/components/examples/ErrorInvalidBookingUUID'
    BookingExtendError:
      description: Bad Request. The Booking hold could not be extended.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error:
                type: string
              errorMessage:
                type: string
              uuid:
                type: string
            required:
            - error
            - errorMessage
          examples:
            INVALID_BOOKING_UUID:
              $ref: '#/components/examples/ErrorInvalidBookingUUID'
            UNPROCESSABLE_ENTITY:
              $ref: '#/components/examples/ErrorUnprocessableEntity'
  parameters:
    ContentType:
      description: Required on all requests that have a request body.
      in: header
      name: Content-Type
      schema:
        enum:
        - application/json
        type: string
  securitySchemes:
    Auth:
      type: http
      scheme: bearer
  requestBodies:
    BookingCancellation:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                examples:
                - Customer requested
                description: Text value describing why the Booking is cancelled.
              force:
                type: boolean
          examples:
            example-1:
              value:
                reason: Customer requested
      description: ''
    ExtendReservation:
      content:
        application/json:
          schema:
            type: object
            properties:
              expirationMinutes:
                type: integer
                examples:
                - 15
                description: |-
                  Number of additional minutes to extend the Booking hold period.

                  The total hold duration MUST NOT exceed the Supplier-defined maximum.
          examples:
            example-1:
              value:
                expirationMinutes: 15
    BookingUpdate:
      content:
        application/json:
          schema:
            type: object
            properties:
              resellerReference:
                type: string
                description: Updated Reseller reference associated with the Booking.
                examples:
                - RES-BOOK-001
              productId:
                type: string
                description: Updated identifier of the Product for the Booking.
                examples:
                - PROD-OBSWHEEL-001
              optionId:
                type: string
                description: Updated identifier of the Option for the Booking.
                examples:
                - OPT-STANDARD-001
              availabilityId:
                type: string
                description: Updated identifier of the Availability (ISO 8601 datetime) for the Booking.
                examples:
                - AVAIL-AVAILABLE-001
              expirationMinutes:
                type: integer
                description: How many minutes to reserve the availability, otherwise defaults to the supplier default amount.
                examples:
                - 30
              notes:
                type: string
                description: Updated notes associated with the Booking.
                examples:
                - Wheelchair accessible entry requested
              unitItems:
                type: array
                description: An array of unit items in the booking. To retain or modify existing unit items, you must include the unit item with the associated uuid, otherwise that unit item will be removed.
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      format: uuid
                      description: A unique UUID to identify the unit item.
                    unitId:
                      type: string
                      description: |-
                        Identifier of the Unit type to be booked.

                        All unit items MUST be provided in the request to retain them.
                      examples:
                      - UNIT-ADULT
                    resellerReference:
                      $ref: '#/components/schemas/UnitResellerReference'
                    contact:
                      $ref: '#/components/schemas/ContactInput'
                  required:
                  - unitId
              contact:
                $ref: '#/components/schemas/ContactInput'
          examples:
            example-1:
              value:
                notes: Wheelchair accessible entry requested. Please also reserve a parking space close to the entrance.
    BookingReservation:
      content:
        application/json:
          schema:
            type: object
            properties:
              uuid:
                type: string
                description: |-
                  Unique idempotency key for the booking request.

                  Resellers SHOULD provide a uuid to ensure idempotent booking creation.

                  If the same value is reused, the Supplier MUST return the same result and MUST NOT create a duplicate Booking.
                format: uuid
                examples:
                - 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
              testMode:
                type: boolean
                deprecated: true
                default: false
                description: |-
                  [DEPRECATED] Indicates that the Booking is a test Booking and MUST NOT be fulfilled as a real sale by the Supplier.

                  If provided, the Supplier MUST return the same value in the `testMode` field of the Booking and MUST preserve it for the lifetime of the Booking, including on confirmation.

                  Deprecation advice: Use a test environment for test bookings.
                examples:
                - false
              productId:
                type: string
                description: Identifier of the Product to be booked.
                examples:
                - PROD-OBSWHEEL-001
              optionId:
                type: string
                description: Identifier of the Option to be booked for the selected Product.
                examples:
                - OPT-STANDARD-001
              availabilityId:
                type: string
                description: |-
                  Identifier of the selected Availability (ISO 8601 datetime) for the Booking.

                  This value MUST be obtained from the `/availability` endpoint.
                examples:
                - AVAIL-AVAILABLE-001
              expirationMinutes:
                type: integer
                description: |-
                  Number of minutes the selected Availability is held before confirmation.

                  If not provided, the Supplier default MUST be applied.

                  After expiration, the held Availability MAY be released and the Booking request MUST be rejected if not confirmed.
                examples:
                - 30
              notes:
                type: string
                description: Additional notes associated with the Booking.
                examples:
                - Wheelchair accessible entry requested
              unitItems:
                type: array
                description: A list of unit items that will be included in the booking.
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      format: uuid
                      description: |-
                        Unique idempotency key for the unit item.

                        If the same value is reused, the Supplier MUST treat the request as idempotent for this unit item.
                      examples:
                      - 3b1bc2ee-3155-4738-9471-f49842a07327
                    unitId:
                      type: string
                      description: |-
                        Identifier of the Unit type to be booked.

                        The value MUST match a valid `unitId` defined in the selected Option.
                      examples:
                      - UNIT-ADULT
                  required:
                  - unitId
            required:
            - productId
            - optionId
            - availabilityId
            - unitItems
          examples:
            Reserve Booking:
              value:
                uuid: 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
                productId: PROD-OBSWHEEL-001
                optionId: OPT-STANDARD-001
                availabilityId: AVAIL-AVAILABLE-001
                notes: Wheelchair accessible entry requested
                unitItems:
                - uuid: 3b1bc2ee-3155-4738-9471-f49842a07327
                  unitId: UNIT-ADULT
                - uuid: b0d4f2a1-7c58-4a19-9f3e-2c7d8e5a1b64
                  unitId: UNIT-CHILD
      description: ''
    BookingConfirmation:
      content:
        application/json:
          schema:
            type: object
            properties:
              resellerReference:
                type: string
                description: |-
                  Reseller reference associated with the Booking.

                  This field MUST be provided when required by the Reseller configuration.
                examples:
                - RES-BOOK-001
              contact:
                allOf:
                - $ref: '#/components/schemas/ContactInput'
                description: Contact details for the lead traveler, the main guest who will attend the experience. The fields required are listed in `Option.requiredContactFields`.
              unitItems:
                type: array
                description: An array of unit items that will be included in the booking. This allows you to provide contact details or a reseller reference for each unit item. Be careful to make sure you include ALL unit items that you also had in the original booking reservation request, if you provide more or less than in the booking reservation call this will change the number of unit items being purchased also.
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      format: uuid
                      description: |-
                        Unique idempotency key for the unit item.

                        If the same value is reused, the Supplier MUST treat the request as idempotent for this unit item.
                      examples:
                      - 3b1bc2ee-3155-4738-9471-f49842a07327
                    unitId:
                      type: string
                      description: |-
                        Identifier of the Unit type to be confirmed.

                        All unit items MUST be provided.

                        Providing this field MUST replace all existing unit items in the Booking.
                      examples:
                      - UNIT-ADULT
                    resellerReference:
                      allOf:
                      - $ref: '#/components/schemas/UnitResellerReference'
                      description: Reseller reference associated with the individual unit item.
                      examples:
                      - RES-TICKET-001
                    contact:
                      allOf:
                      - $ref: '#/components/schemas/ContactInput'
                      description: Contact details for the individual ticket holder of this unit item. The fields required are listed in `Unit.requiredContactFields`.
                  required:
                  - unitId
            required:
            - contact
          examples:
            Confirmation:
              value:
                resellerReference: RES-BOOK-001
                contact:
                  fullName: John Doe
                  firstName: John
                  lastName: Doe
                  emailAddress: john.doe@example.com
                  phoneNumber: '+442021436587'
                  locales:
                  - en-GB
                  - en
                  postalCode: SE1 9AA
                  country: GB
                  notes: Wheelchair access requested
                unitItems:
                - uuid: 3b1bc2ee-3155-4738-9471-f49842a07327
                  unitId: UNIT-ADULT
                  resellerReference: RES-TICKET-001
                - uuid: b0d4f2a1-7c58-4a19-9f3e-2c7d8e5a1b64
                  unitId: UNIT-CHILD
                  resellerReference: RES-TICKET-002
      description: ''
