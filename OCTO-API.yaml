          examples:
          - AVAIL-AVAILABLE-001
        availability:
          $ref: '#/components/schemas/BookedAvailability'
        contact:
          description: Lead traveler's contact details
          allOf:
          - $ref: '#/components/schemas/ContactOutput'
        notes:
          description: Booking-level notes, freely provided by or on behalf of the lead traveler.
          type:
          - string
          - 'null'
          examples:
