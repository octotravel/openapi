                          accompaniedBy: []
                      - id: UNIT-CHILD
                        internalName: Child
                        reference: CHILD
                        type: CHILD
                        requiredContactFields:
                        - firstName
                        - lastName
                        restrictions:
                          minAge: 3
                          maxAge: 17
                          idRequired: false
                          minQuantity: 0
                          maxQuantity: 7
                          paxCount: 1
                          accompaniedBy:
                          - UNIT-ADULT
                    cancellable: true
                    cancellation: null
                    freesale: false
                    availabilityId: AVAIL-AVAILABLE-001
                    availability:
                      id: AVAIL-AVAILABLE-001
                      localDateTimeStart: '2026-06-15T10:00:00+01:00'
                      localDateTimeEnd: '2026-06-15T10:30:00+01:00'
                      allDay: false
                      openingHours: []
                    contact:
                      fullName: John Doe
                      firstName: John
                      lastName: Doe
                      emailAddress: john.doe@example.com
                      phoneNumber: '+442021436587'
                      locales:
                      - en-GB
                      postalCode: SE1 9AA
                      country: GB
                      notes: Wheelchair access requested
                    notes: Wheelchair accessible entry requested
                    deliveryMethods:
                    - TICKET
                    voucher: null
                    unitItems:
                    - uuid: 3b1bc2ee-3155-4738-9471-f49842a07327
                      resellerReference: RES-TICKET-001
                      supplierReference: SUP-TICKET-001
                      unitId: UNIT-ADULT
                      unit:
                        id: UNIT-ADULT
                        internalName: Adult
                        reference: ADULT
                        type: ADULT
                        requiredContactFields:
                        - firstName
                        - lastName
                        restrictions:
                          minAge: 18
                          maxAge: 99
                          idRequired: false
                          minQuantity: 1
                          maxQuantity: 7
                          paxCount: 1
                          accompaniedBy: []
                      status: CONFIRMED
                      utcRedeemedAt: null
                      contact:
                        firstName: John
                        lastName: Doe
                        locales:
                        - en-GB
                      ticket:
                        redemptionMethod: DIGITAL
                        utcRedeemedAt: null
                        deliveryOptions:
                        - deliveryFormat: QRCODE
                          deliveryValue: TICKET-QRCODE-001
                        - deliveryFormat: PDF_URL
                          deliveryValue: https://api.acme-attractions.com/octo/tickets/BOOK-CONFIRMED-001.pdf
                    - uuid: b0d4f2a1-7c58-4a19-9f3e-2c7d8e5a1b64
                      resellerReference: RES-TICKET-002
                      supplierReference: SUP-TICKET-002
                      unitId: UNIT-CHILD
                      unit:
                        id: UNIT-CHILD
                        internalName: Child
                        reference: CHILD
                        type: CHILD
                        requiredContactFields:
                        - firstName
                        - lastName
                        restrictions:
                          minAge: 3
                          maxAge: 17
                          idRequired: false
                          minQuantity: 0
                          maxQuantity: 7
                          paxCount: 1
                          accompaniedBy:
                          - UNIT-ADULT
                      status: CONFIRMED
                      utcRedeemedAt: null
                      contact:
                        firstName: Jane
                        lastName: Doe
                        locales:
                        - en-GB
                      ticket:
                        redemptionMethod: DIGITAL
                        utcRedeemedAt: null
                        deliveryOptions:
                        - deliveryFormat: QRCODE
                          deliveryValue: TICKET-QRCODE-002
                        - deliveryFormat: PDF_URL
                          deliveryValue: https://api.acme-attractions.com/octo/tickets/BOOK-CONFIRMED-001.pdf
        '400':
          $ref: '#/components/responses/BookingListError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - schema:
          type: string
          examples:
          - RES-BOOK-001
        in: query
        name: resellerReference
        description: Reseller reference associated with the Booking.
      - schema:
          type: string
          examples:
          - SUP-BOOK-001
        in: query
        name: supplierReference
        description: Supplier reference associated with the Booking.
      - schema:
          type: string
          format: date
          examples:
          - '2026-06-15'
        in: query
        name: localDate
        description: |-
          Local date of the Booking in ISO 8601 format (YYYY-MM-DD).

          Filters Bookings for a specific date.
      - schema:
          type: string
          format: date
          examples:
          - '2026-06-15'
        in: query
        name: localDateStart
        description: |-
          Start of the local date range in ISO 8601 format (YYYY-MM-DD).

          MUST be used together with localDateEnd.
      - schema:
          type: string
          format: date
          examples:
          - '2026-06-18'
        in: query
        name: localDateEnd
        description: |-
          End of the local date range in ISO 8601 format (YYYY-MM-DD).

          MUST be used together with localDateStart.
      - schema:
          type: string
          examples:
          - PROD-OBSWHEEL-001
        in: query
        name: productId
        description: Identifier of the Product associated with the Booking.
      - schema:
          type: string
          examples:
          - OPT-STANDARD-001
        in: query
        name: optionId
        description: Identifier of the Option associated with the Booking.
      description: |-
        Returns Bookings that match the provided filters.

        At least one of the following query parameters MUST be included:
        - `resellerReference`
        - `supplierReference`
        - `localDate`
        - `localDateStart` and `localDateEnd`
  /bookings/{uuid}/confirm:
    post:
      summary: Confirm Booking
      tags:
      - Bookings
      operationId: confirmBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                CONFIRMED:
                  $ref: '#/components/examples/BookingConfirmed'
        '400':
          $ref: '#/components/responses/BookingConfirmError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: |-
        Triggers Booking Confirmation, signaling that the Reseller has committed to the purchase. This prompts the Supplier System to persist the Booking and provide the Reseller System with the required ticket(s).
      parameters:
      - $ref: '#/components/parameters/ContentType'
      requestBody:
        $ref: '#/components/requestBodies/BookingConfirmation'
    parameters:
    - schema:
        type: string
        format: uuid
        examples:
        - 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking to be confirmed.
  /bookings/{uuid}/cancel:
    post:
      summary: Cancel Booking
      tags:
      - Bookings
      operationId: cancelBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                CANCELLED:
                  $ref: '#/components/examples/BookingCancelled'
        '400':
          $ref: '#/components/responses/BookingCancelError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: |-
        Cancels a Booking. A Booking MUST NOT be cancelled unless `booking.cancellable` is `true` and the request is within the cancellation cut-off window.
      requestBody:
        $ref: '#/components/requestBodies/BookingCancellation'
      parameters:
      - $ref: '#/components/parameters/ContentType'
    parameters:
    - schema:
        type: string
        format: uuid
        examples:
        - 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking to be cancelled.
  /bookings/{uuid}:
    get:
      summary: Get Booking
      tags:
      - Bookings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingConfirmed'
        '400':
          $ref: '#/components/responses/BookingGetError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getBooking
      description: |-
        Returns an existing Booking identified by `uuid`.
      parameters:
      - schema:
          type: string
          format: uuid
          examples:
          - 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
        name: uuid
        in: path
        required: true
        description: Unique identifier of the Booking to retrieve.
    patch:
      summary: Update Booking
      tags:
      - Bookings
      operationId: updateBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingUpdated'
        '400':
          $ref: '#/components/responses/BookingConfirmError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        $ref: '#/components/requestBodies/BookingUpdate'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      - schema:
          type: string
          format: uuid
          examples:
          - 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
        name: uuid
        in: path
        required: true
        description: Unique identifier of the Booking to be updated.
      description: |-
        Updates a Booking both before and after confirmation, provided no modification restrictions apply. For example: the Booking has not been redeemed and is within the cancellation cut-off window.

        A Booking MUST only be updated if `booking.cancellable` is `true`. If a Booking is cancellable, it SHOULD also be updatable. Updating a Booking SHOULD be preferred over cancelling and recreating it.
  /bookings/{uuid}/extend:
    parameters:
    - schema:
        type: string
        format: uuid
        examples:
        - 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking in `ON_HOLD` status.
    post:
      summary: Extend Booking Hold
      tags:
      - Bookings
      operationId: extendBookingHold
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingOnHold'
        '400':
          $ref: '#/components/responses/BookingExtendError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        $ref: '#/components/requestBodies/ExtendReservation'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      description: |-
        Extends the reservation hold for a Booking with `ON_HOLD` status, preserving the reserved availability while additional time is required to complete the Booking. It is up to the Supplier to define what limits to apply.
components:
  schemas:
    Availability:
      type: object
      examples:
      - id: AVAIL-FREESALE-001
        localDateTimeStart: '2026-06-15T00:00:00+01:00'
        localDateTimeEnd: '2026-06-16T00:00:00+01:00'
        allDay: true
        available: true
        status: FREESALE
        vacancies: null
        capacity: null
        maxUnits: null
        utcCutoffAt: '2026-06-15T08:00:00Z'
        openingHours:
        - from: '09:00'
          to: '17:00'
      - id: AVAIL-AVAILABLE-001
        localDateTimeStart: '2026-06-15T10:00:00+01:00'
        localDateTimeEnd: '2026-06-15T10:30:00+01:00'
        allDay: false
        available: true
        status: AVAILABLE
        vacancies: 25
        capacity: 100
        maxUnits: 10
        utcCutoffAt: '2026-06-15T08:00:00Z'
        openingHours: []
      title: ''
      description: Schema for the `/availability/calendar` endpoint. It's designed to be queried for large date ranges and the result is used to populate an availability calendar.
      properties:
        id:
          type: string
          examples:
          - AVAIL-AVAILABLE-001
          description: Unique availability identifier. Used as availabilityId when booking. Unique within the context of the respective Product. (Max. 255 ASCII characters)
        localDateTimeStart:
          type: string
          examples:
          - '2026-06-15T10:00:00+01:00'
          description: Local start datetime of this slot
          format: date-time
        localDateTimeEnd:
          type: string
          examples:
          - '2026-06-15T10:30:00+01:00'
          description: Local end datetime of this slot
          format: date-time
        allDay:
          type: boolean
          description: If true, this is an all-day slot (not a fixed departure time). No other availability on same day.
          examples:
          - false
        available:
          type: boolean
          deprecated: true
          description: '[DEPRECATED] Indicates whether at least one vacancy is available. This field is deprecated and SHOULD NOT be used. The `status` field SHOULD be used instead.'
          examples:
          - true
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
        vacancies:
          $ref: '#/components/schemas/Vacancies'
        capacity:
          type:
          - integer
          - 'null'
          examples:
          - 100
          description: Indicates the total available capacity. A `null` value MAY be returned when capacity details cannot be reliably shared. This SHOULD NOT be done unless necessary.
        maxUnits:
          type:
          - integer
          - 'null'
          examples:
          - 10
          description: Max units that can be in a single booking on this timeslot. A `null` value implies there's no explicit limit.
        utcCutoffAt:
          type: string
          examples:
          - '2026-06-15T08:00:00Z'
          description: UTC time by which a booking must be confirmed
        openingHours:
          description: Opening hours for this day (empty array for `START_TIME` products)
          type: array
          items:
            $ref: '#/components/schemas/OpeningHours'
      required:
      - id
      - localDateTimeStart
      - localDateTimeEnd
      - allDay
      - available
      - status
      - vacancies
      - capacity
      - maxUnits
      - utcCutoffAt
      - openingHours
    AvailabilityCalendar:
      type: object
      examples:
      - localDate: '2026-06-15'
        available: true
        status: AVAILABLE
        vacancies: 25
        capacity: 100
        openingHours:
        - from: '09:00'
          to: '17:00'
      description: Schema for the `/availability/calendar` endpoint. For querying general open slots per day on a large range of days versus availability per departure time.
      properties:
        localDate:
          type: string
          examples:
          - '2026-06-15'
          description: The date in ISO 8601 format (YYYY-MM-DD)
          format: date
        available:
          type: boolean
          deprecated: true
          description: '[DEPRECATED] Indicates whether at least one vacancy is available. This field is deprecated and SHOULD NOT be used. The `status` field SHOULD be used instead.'
