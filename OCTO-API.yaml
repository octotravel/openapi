          examples:
          - false
        resellerReference:
          type:
          - string
          - 'null'
          description: Reseller system-provided reference for the Booking. Value MAY be set by the Reseller in the Booking confirmation request. Omitting this value MAY complicate cross-referencing between the Reseller and the Supplier.
          examples:
          - RES-BOOK-001
        supplierReference:
          type:
          - string
          - 'null'
          description: Supplier system-provided reference for the Booking. Omitting this value MAY complicate cross-referencing between the Reseller and the Supplier.
          examples:
          - SUP-BOOK-001
        status:
          $ref: '#/components/schemas/BookingStatus'
        utcCreatedAt:
          type: string
          examples:
          - '2026-06-15T08:30:00Z'
          description: ISO 8601 UTC timestamp indicating when the Booking was created in the Supplier system.
        utcUpdatedAt:
          type:
          - string
          - 'null'
          examples:
          - '2026-06-15T08:35:00Z'
          description: ISO 8601 UTC timestamp indicating when the Booking was last updated in the Supplier system. A `null` value implies the Booking was never updated.
        utcExpiresAt:
          type:
          - string
          - 'null'
          description: ISO 8601 UTC timestamp indicating when the Booking expires if the status is `ON_HOLD`. SHOULD be set to `null` if the `Booking.status` is NOT `ON_HOLD`. A Booking with status `ON_HOLD` MUST have an expiration date/time.
          examples:
          - '2026-06-15T09:00:00Z'
        utcRedeemedAt:
          type:
          - string
          - 'null'
          description: ISO 8601 UTC timestamp indicating when the Booking was redeemed. A `null` value implies that redemption hasn't happened or the system does not have this information
          examples:
          - '2026-06-15T10:05:00Z'
        utcConfirmedAt:
          type:
          - string
          - 'null'
          examples:
          - '2026-06-15T08:35:00Z'
          description: ISO 8601 UTC timestamp indicating when the Booking was confirmed. A Booking with `status` = `CANCELLED` should continue to have its `utcConfirmedAt` value set.
        productId:
          type: string
          examples:
          - PROD-OBSWHEEL-001
          description: Identifier of the booked product.
        product:
          description: Embedded Product object at the time of booking.
          allOf:
          - $ref: '#/components/schemas/Product'
        optionId:
          type: string
          examples:
          - OPT-STANDARD-001
          description: Identifier of the Product's Option for the Booking.
        option:
          description: Embedded `option` object at the time of booking.
          allOf:
          - $ref: '#/components/schemas/Option'
        cancellable:
          type: boolean
          description: Indicates whether the Booking can currently be cancelled while issuing a full refund. A `true` value indicates that no cancellation blocking reasons were encountered by the Supplier System and the request for cancellation SHOULD be accepted at this particular point in time.
          examples:
          - true
        cancellation:
          $ref: '#/components/schemas/Cancellation'
        freesale:
          type: boolean
          deprecated: true
          description: |-
            [DEPRECATED] Indicates whether the Booking was made without an availability check.
            Deprecation advice: Rely on the `availabilityRequired` field instead.
          examples:
