openapi: 3.1.0
info:
  title: OCTO API Specification
  version: '1.0'
  contact:
    email: sayhello@octo.travel
    url: https://www.octo.travel/contact
    name: OCTO Standards NP Inc.
  description: |-
    OCTO (Open Connectivity for Tours, Activities, and Attractions) is an open standard API specification for the in-destination experiences sector of the travel industry. The standard defines agreed-upon schemas, endpoints, and capabilities commonly needed when connecting platforms, resellers, OTAs, and other technologies in tours, activities, and attractions. 

    OCTO is open source. Available to anyone who wants to use it. You do not need to be a member to use this specification in your business.
servers:
- url: https://api.acme-attractions.com/octo
security:
- Auth: []
paths:
  /supplier:
    get:
      summary: Get Supplier
      operationId: getSupplier
      tags:
      - Supplier
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          $ref: '#/components/responses/GetSupplierError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: |-
        Returns the Supplier associated with the API Key (Bearer Token), including its details.

        All API calls MUST include a valid API Key. That API Key scopes the request to a specific Supplier.
  /products:
    get:
      summary: List Products
      operationId: listProducts
      tags:
      - Products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: |-
        Returns all Products offered by the Supplier.
  /products/{id}:
    get:
      summary: Get Product
      operationId: getProduct
      tags:
      - Products
      parameters:
      - schema:
          type: string
          examples:
          - PROD-OBSWHEEL-001
        name: id
        in: path
        required: true
        description: Identifier of the Product being queried.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/GetProductError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      description: |-
        Returns the Product for the specified Product ID.
  /availability/calendar:
    post:
      summary: Availability Calendar
      operationId: availabilityCalendar
      tags:
      - Availability
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityCalendar'
              examples:
                START_TIMES:
                  $ref: '#/components/examples/AvailabilityCalendarStartTimes'
                OPENING_HOURS:
                  $ref: '#/components/examples/AvailabilityCalendarOpeningHours'
        '400':
          $ref: '#/components/responses/AvailabilityCalendarError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                  examples:
                  - PROD-OBSWHEEL-001
                  description: Identifier of the Product being queried.
                optionId:
                  type: string
                  examples:
                  - OPT-STANDARD-001
                  description: Identifier of the Option being queried.
                localDateStart:
                  type: string
                  format: date
                  examples:
                  - '2026-06-15'
                  description: Start date of range (YYYY-MM-DD).
                localDateEnd:
                  type: string
                  format: date
                  examples:
                  - '2026-06-18'
                  description: End date of range (YYYY-MM-DD).
                units:
                  type: array
                  description: A list of units.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        examples:
                        - UNIT-ADULT
                        description: Unit id for capacity filtering.
                      quantity:
                        type: integer
                        examples:
                        - 2
                        description: Quantity of the unit.
                    required:
                    - id
                    - quantity
              required:
              - productId
              - optionId
              - localDateStart
              - localDateEnd
            examples:
              Date Range:
                value:
                  productId: PROD-OBSWHEEL-001
                  optionId: OPT-STANDARD-001
                  localDateStart: '2026-06-15'
                  localDateEnd: '2026-06-18'
              WITH UNITS:
                value:
                  productId: PROD-OBSWHEEL-001
                  optionId: OPT-STANDARD-001
                  localDateStart: '2026-06-15'
                  localDateEnd: '2026-06-18'
                  units:
                  - id: UNIT-ADULT
                    quantity: 2
                  - id: UNIT-CHILD
                    quantity: 1
      description: |-
        Returns one Availability Calendar object per day for the specified date range, Product, and Option. Optimized for querying large date ranges where only date-level availability is required, not individual timeslots and their Availability.  
        Commonly used to quickly populate an availability calendar UI element.

        The Availability Check endpoint MUST still be called to obtain the `availabilityId` required to create a Booking.

        The following parameters MUST be provided: `localDateStart` and `localDateEnd`.
  /availability:
    post:
      summary: Availability Check
      operationId: availabilityCheck
      tags:
      - Availability
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Availability'
              examples:
                OPENING_HOURS:
                  $ref: '#/components/examples/AvailabilityOpeningHours'
                START_TIMES:
                  $ref: '#/components/examples/AvailabilityStartTimes'
        '400':
          $ref: '#/components/responses/AvailabilityCheckError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                  examples:
                  - PROD-OBSWHEEL-001
                  description: The Product id.
                optionId:
                  type: string
                  examples:
                  - OPT-STANDARD-001
                  description: The Option id.
                localDateStart:
                  type: string
                  examples:
                  - '2026-06-15'
                  format: date
                  description: Start date. Required if localDateEnd is set.
                localDateEnd:
                  type: string
                  format: date
                  examples:
                  - '2026-06-18'
                  description: End date. Required if localDateStart is set.
                availabilityIds:
                  type: array
                  examples:
                  - - AVAIL-AVAILABLE-001
                  description: Filter by specific availability IDs.
                  items:
                    type: string
                units:
                  type: array
                  description: A list of units.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        examples:
                        - UNIT-ADULT
                        description: Unit id for capacity filtering.
                      quantity:
                        type: integer
                        examples:
                        - 2
                        description: Quantity of the unit.
                    required:
                    - id
                    - quantity
              required:
              - productId
              - optionId
            examples:
              Date Range:
                value:
                  productId: PROD-OBSWHEEL-001
                  optionId: OPT-STANDARD-001
                  localDateStart: '2026-06-15'
                  localDateEnd: '2026-06-18'
              Availability IDs:
                value:
                  productId: PROD-OBSWHEEL-001
                  optionId: OPT-STANDARD-001
                  availabilityIds:
                  - AVAIL-AVAILABLE-001
              With Units:
                value:
                  productId: PROD-OBSWHEEL-001
                  optionId: OPT-STANDARD-001
                  localDateStart: '2026-06-15'
                  localDateEnd: '2026-06-18'
                  units:
                  - id: UNIT-ADULT
                    quantity: 2
                  - id: UNIT-CHILD
                    quantity: 1
      description: |-
        Returns granular Availability details for the specified Product and Option. Returns individual Availability objects that each cover a specific timeslot/departure time or simply a single object per day, depending on the Product's configuration.  Provides the availability ID required to Create Booking.

        One of the following parameter combinations MUST be provided, or a logical combination thereof: `localDateStart` and `localDateEnd`; or `availabilityIds`.
  /bookings:
    post:
      summary: Create Booking
      tags:
      - Bookings
      operationId: createBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                ON_HOLD:
                  $ref: '#/components/examples/BookingOnHold'
        '400':
          $ref: '#/components/responses/BookingCreateError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      requestBody:
        $ref: '#/components/requestBodies/BookingReservation'
      description: |-
        Creates a Booking by reserving a specific `availabilityId`.

        The `availabilityId` MUST be obtained from the Availability Check endpoint prior to creating the Booking.

        This step reserves the selected Availability (i.e., “tickets”) to guarantee it remains available for the Booking if it is confirmed within the defined time window. The Booking remains in `ON_HOLD` status until it is confirmed or the reservation expires.

        The reservation duration is defined by the `expirationMinutes` parameter, if provided, up to an internal limit set by the Supplier or the OCTO provider. The `utc_expires_at` field in the response indicates exactly when the reservation will expire.

        A reserved Booking MAY be confirmed using the Confirm Booking endpoint, provided the reservation has not expired.
    get:
      summary: List Bookings
      tags:
      - Bookings
      operationId: listBookings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
              examples:
                example-1:
                  value:
                  - id: BOOK-CONFIRMED-001
                    uuid: 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
                    testMode: false
                    resellerReference: RES-BOOK-001
                    supplierReference: SUP-BOOK-001
                    status: CONFIRMED
                    utcCreatedAt: '2026-06-15T08:30:00Z'
                    utcUpdatedAt: '2026-06-15T08:35:00Z'
                    utcExpiresAt: null
                    utcRedeemedAt: null
                    utcConfirmedAt: '2026-06-15T08:35:00Z'
                    productId: PROD-OBSWHEEL-001
                    product:
                      id: PROD-OBSWHEEL-001
                      internalName: Observation Wheel Admission
                      reference: OBSWHEEL
                      locale: en-GB
                      timeZone: Europe/London
                      allowFreesale: false
                      instantConfirmation: true
                      instantDelivery: true
                      availabilityRequired: true
                      availabilityType: START_TIME
                      deliveryFormats:
                      - QRCODE
                      - PDF_URL
                      deliveryMethods:
                      - TICKET
                      redemptionMethod: DIGITAL
                      options:
                      - id: OPT-STANDARD-001
                        default: true
                        internalName: Standard Admission
                        reference: STANDARD
                        availabilityLocalStartTimes:
                        - '10:00'
                        - '14:00'
                        - '16:00'
                        cancellationCutoff: 24 hours
                        cancellationCutoffAmount: 24
                        cancellationCutoffUnit: hour
                        requiredContactFields:
                        - firstName
                        - lastName
                        restrictions:
                          minUnits: 1
                          maxUnits: 20
                        units:
                        - id: UNIT-ADULT
                          internalName: Adult
                          reference: ADULT
                          type: ADULT
                          requiredContactFields:
                          - firstName
                          - lastName
                          restrictions:
                            minAge: 18
                            maxAge: 99
                            idRequired: false
                            minQuantity: 1
                            maxQuantity: 7
                            paxCount: 1
                            accompaniedBy: []
                        - id: UNIT-CHILD
                          internalName: Child
                          reference: CHILD
                          type: CHILD
                          requiredContactFields:
                          - firstName
                          - lastName
                          restrictions:
                            minAge: 3
                            maxAge: 17
                            idRequired: false
                            minQuantity: 0
                            maxQuantity: 7
                            paxCount: 1
                            accompaniedBy:
                            - UNIT-ADULT
                    optionId: OPT-STANDARD-001
                    option:
                      id: OPT-STANDARD-001
                      default: true
                      internalName: Standard Admission
                      reference: STANDARD
                      availabilityLocalStartTimes:
                      - '10:00'
                      - '14:00'
                      - '16:00'
                      cancellationCutoff: 24 hours
                      cancellationCutoffAmount: 24
                      cancellationCutoffUnit: hour
                      requiredContactFields:
                      - firstName
                      - lastName
                      restrictions:
                        minUnits: 1
                        maxUnits: 20
                      units:
                      - id: UNIT-ADULT
                        internalName: Adult
                        reference: ADULT
                        type: ADULT
                        requiredContactFields:
                        - firstName
                        - lastName
                        restrictions:
                          minAge: 18
                          maxAge: 99
                          idRequired: false
                          minQuantity: 1
                          maxQuantity: 7
