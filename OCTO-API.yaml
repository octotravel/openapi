        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHours'
      required:
      - localDate
      - available
      - status
      - vacancies
      - capacity
      - openingHours
    AvailabilityStatus:
      type: string
      title: AvailabilityStatus
      enum:
      - AVAILABLE
      - FREESALE
      - SOLD_OUT
      - LIMITED
      - CLOSED
      description: |-
        Indicates the availability status for the given date.

        Possible values:
        - `AVAILABLE`: Slot is available with remaining capacity.
        - `FREESALE`: No capacity limit, always available. The `vacancies` and `capacity` fields do not convey a capacity constraint; `vacancies` MUST be returned as `null` (see `Vacancies`).
        - `SOLD_OUT`: No remaining capacity for this date/slot.
        - `LIMITED`: Available, but likely to sell out. The Supplier alone determines when Availability is limited. The `vacancies` field, if populated, SHOULD be used to determine the remaining quantity.
        - `CLOSED`: The venue/Product is closed on this date/slot.
      examples:
      - AVAILABLE
    AvailabilityType:
      type: string
      title: AvailabilityType
      enum:
      - START_TIME
      - OPENING_HOURS
      description: |-
        Specifies the type of Availability for the Product.

        Possible values:
        - `START_TIME`: For Products with fixed departure times (e.g., a walking tour at set times during the day).
        - `OPENING_HOURS`: For Products where customers select a date and can visit anytime during operating hours (e.g., a museum general admission ticket valid at any time when the museum is open).
      examples:
      - OPENING_HOURS
    BookedAvailability:
